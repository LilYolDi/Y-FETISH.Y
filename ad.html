<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Создать текстовую анкету | Y-FETISH</title>

    <meta name="robots"
          content="noindex, follow">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 25px 15px 50px;
        }

        .logo {
            text-align: center;
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .logo-y {
            color: red;
        }

        .logo-fetish {
            color: white;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            background: #111;
            color: #fff;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 13px;
            font-size: 16px;
            outline: none;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: red;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;

            background: #e00000;
            color: white;

            border: 0;
            border-radius: 8px;

            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: red;
        }

        .back {
            display: block;
            text-align: center;
            color: #aaa;
            margin-top: 20px;
            text-decoration: none;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            line-height: 1.5;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="logo">
        <span class="logo-y">Y</span><span class="logo-fetish">-FETISH</span>
    </div>

    <h1>
        Создать текстовую анкету
    </h1>

    <form id="adForm">

        <label for="title">
            Название
        </label>

        <input
            id="title"
            name="title"
            type="text"
            maxlength="120"
            placeholder="Например: Госпожа ищет раба"
            required
        >

        <label for="type">
            Кто ты?
        </label>

        <select id="type" name="type" required>

            <option value="">
                Выберите
            </option>

            <option value="Госпожа">
                Госпожа
            </option>

            <option value="Раб">
                Раб
            </option>

        </select>

        <label for="city">
            Город
        </label>

        <input
            id="city"
            name="city"
            type="text"
            maxlength="80"
            placeholder="Ивано-Франковск"
            required
        >

        <label for="description">
            Текст анкеты
        </label>

        <textarea
            id="description"
            name="description"
            maxlength="5000"
            placeholder="Напишите текст вашей анкеты..."
            required
        ></textarea>

        <label for="telegram">
            Telegram
        </label>

        <input
            id="telegram"
            name="telegram"
            type="text"
            maxlength="100"
            placeholder="@username"
        >

        <button type="submit">
            ОПУБЛИКОВАТЬ
        </button>

    </form>

    <div id="message"></div>

    <a class="back" href="/text-ads.html">
        ← Вернуться к анкетам
    </a>

</div>

<script>

document
    .getElementById("adForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const message =
            document.getElementById("message");

        const button =
            this.querySelector("button");

        button.disabled = true;
        button.textContent = "ПУБЛИКАЦИЯ...";

        const data = {

            title:
                document.getElementById("title").value.trim(),

            type:
                document.getElementById("type").value,

            city:
                document.getElementById("city").value.trim(),

            description:
                document.getElementById("description").value.trim(),

            telegram:
                document.getElementById("telegram").value.trim()

        };

        try {

            const response =
                await fetch("/api/text-ads", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(data)

                });

            const result =
                await response.json();

            if (!response.ok) {
                throw new Error(
                    result.error || "Ошибка публикации"
                );
            }

            message.style.color = "#00ff66";

            message.textContent =
                "Анкета опубликована.";

            this.reset();

        } catch (error) {

            message.style.color = "#ff3333";

            message.textContent =
                error.message;

        } finally {

            button.disabled = false;
            button.textContent = "ОПУБЛИКОВАТЬ";

        }

    });

</script>

</body>
</html>
