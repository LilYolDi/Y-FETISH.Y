<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Y-New — Вход</title>

    <link
       <link rel="stylesheet" href="./indexx.css">
       <script src="./indexx.js" defer></script>
    >

</head>

<body>

<main class="login-page">

    <section class="login-card">

        <a
            href="/profiles.html"
            class="login-logo"
        >
            <span>Y</span>-New
        </a>


        <h1>
            Вход в Y-New
        </h1>


        <p class="login-description">
            Авторизуйтесь через Telegram,
            чтобы пользоваться сайтом.
        </p>


        <div
            id="telegramLogin"
            class="telegram-login"
        >

            <div class="telegram-loading">
                Загрузка Telegram...
            </div>

        </div>


        <div
            id="loginMessage"
            class="login-message"
        ></div>


        <a
            href="/profiles.html"
            class="back-to-site"
        >
            ← Вернуться к анкетам
        </a>

    </section>

</main>


<script
    src="/register/login.js"
    defer
></script>

</body>
</html>
