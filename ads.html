<main class="container">

    <div class="seo-text">
        <p>
            Текстовые анкеты Y-FETISH для знакомств.
            Здесь размещаются объявления, где
            <strong>госпожа ищет раба</strong>
            или <strong>раб ищет госпожу</strong>.
        </p>

        <p>
            Анкеты доступны по городам Украины:

            и другие города.
        </p>

    <div class="filters">
        <button onclick="loadAds('all')">Все</button>
        <button onclick="loadAds('Госпожа')">Госпожа</button>
        <button onclick="loadAds('Раб')">Раб</button>
    </div>

    <div id="ads">
        <div class="empty">Загрузка анкет...</div>
    </div>

</main>

</div>

<script>

async function loadAds(type = "all") {

    const container = document.getElementById("ads");

    try {

        const response = await fetch("/api/text-ads");

        if (!response.ok) {
            throw new Error("API error");
        }

        const ads = await response.json();

        const filtered =
            type === "all"
                ? ads
                : ads.filter(ad => ad.type === type);

        if (!filtered.length) {

            container.innerHTML =
                '<div class="empty">Анкет пока нет.</div>';

            return;
        }

        container.innerHTML = filtered.map(ad => {

            let telegram = "";

            if (ad.telegram) {

                const username =
                    ad.telegram.replace("@", "").trim();

                telegram = `
                    <a
                        class="telegram"
                        href="https://t.me/${encodeURIComponent(username)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Telegram
                    </a>
                `;
            }

            return `
                <article class="ad">

                    <h2>
                        ${escapeHtml(ad.title)}
                    </h2>

                    <div class="type">
                        ${escapeHtml(ad.type)}
                    </div>

                    <div class="city">
                        📍 ${escapeHtml(ad.city)}
                    </div>

                    <div class="description">
                        ${escapeHtml(ad.description)}
                    </div>

                    ${telegram}

                </article>
            `;

        }).join("");

    } catch (error) {

        container.innerHTML =
            '<div class="empty">Анкеты временно недоступны.</div>';

        console.error(error);
    }
}

function escapeHtml(text) {

    return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

loadAds();

</script>
